<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eization 2.0</title>
    <meta name="theme-color" content="#0C8A50">
    <link rel="icon" href="./resources/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./resources/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="./resources/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./resources/css/style.css">
    <script src="https://kit.fontawesome.com/0c5316334b.js" crossorigin="anonymous"></script>

</head>

<body>
    <div id="beatFlash"></div>

    <div id="selectdiv">

    </div>

    <div id="topBar">
        <div id="linediv">
            <div id="status">
                <p id="counter">left</p>
            </div>

            <div id="editdiv">
                <div class="combo" id="exerciseCombo">
                    <button type="button" class="combo-face" id="exerciseFace" aria-haspopup="listbox" aria-expanded="false" aria-label="Exercise: Notes" title="Choose an exercise">
                        <span class="combo-kicker">Exercise</span>
                        <span class="combo-value">Notes</span>
                    </button>
                    <ul class="combo-menu" id="exerciseMenu" role="listbox" hidden></ul>
                </div>
                <button type="button" class="icon-btn" id="resetExercise" title="Start this exercise again" aria-label="Reset exercise">
                    <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
                </button>
                <button type="button" class="icon-btn" id="edit" onclick="ToggleEdit()" title="Edit exercise" aria-label="Edit exercise"><i class="fa-solid fa-pen-to-square"></i></button>
            </div>
        </div>
    </div>
    <div id="textdiv">
        <textarea id="allEdit">df</textarea>
    </div>





    <div id="divnote">



        <p id="note">
            C<sup><small></small></sup>
        </p>

    </div>


    <footer>
        <div id="groovePanel" hidden>
            <p class="groove-label">Click</p>
            <div id="clickGrid"></div>
            <p class="groove-label">Bars</p>
            <div id="cycleRow" title="Play bars use the clicks above. Rest bars stay silent.">
                <div class="stepper stepper-sm">
                    <span class="step-label">Play</span>
                    <button type="button" class="step-down" aria-label="Fewer play bars">−</button>
                    <input id="playBars" type="number" min="0" max="16" step="1" value="1" inputmode="numeric">
                    <button type="button" class="step-up" aria-label="More play bars">+</button>
                </div>
                <div class="stepper stepper-sm">
                    <span class="step-label">Rest</span>
                    <button type="button" class="step-down" aria-label="Fewer rest bars">−</button>
                    <input id="restBars" type="number" min="0" max="16" step="1" value="0" inputmode="numeric">
                    <button type="button" class="step-up" aria-label="More rest bars">+</button>
                </div>
            </div>
        </div>
        <div id="phraseTrack"></div>
        <div id="bottomBar">
        <div id="divfooter">

            <label class="checkbox-label">
                <input type="checkbox" id="volumeCheckbox" />
                <i class="fa fa-volume-xmark"></i> <!-- Default Icon when unchecked -->
            </label>

            <div class="combo combo-up" id="beatsCombo">
                <button type="button" class="combo-face" id="beatsFace" title="Beats per bar" aria-label="Beats per bar" aria-haspopup="listbox" aria-expanded="false">4</button>
                <ul class="combo-menu" id="beatsMenu" role="listbox" hidden></ul>
            </div>
            <div class="stepper" id="beatsCustomStepper" hidden>
                <button type="button" class="step-down" aria-label="Fewer beats">−</button>
                <input type="number" id="beatsCustom" min="1" max="32" step="1" value="4"
                    title="Custom beats per bar" aria-label="Custom beats per bar" inputmode="numeric">
                <button type="button" class="step-up" aria-label="More beats">+</button>
            </div>

            <button type="button" id="grooveButton" title="Click" aria-label="Click" aria-expanded="false">
                <svg class="metro-icon" viewBox="0 0 32 32" aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M5 30 13 8h6l8 22z"/>
                    <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M16 26 23 11"/>
                    <circle cx="24" cy="9.5" r="3.4" fill="currentColor"/>
                </svg>
            </button>

            <div class="stepper" id="bpmStepper">
                <span class="step-label">BPM</span>
                <button type="button" class="step-down" aria-label="Slower">−</button>
                <input type="number" id="bpm" min="0" max="500" step="1" value="100" maxlength="3"
                    title="BPM" aria-label="Tempo" inputmode="numeric">
                <button type="button" class="step-up" aria-label="Faster">+</button>
                <button type="button" id="tempoToggle" aria-label="Pause tempo" aria-pressed="false" title="Pause tempo">
                    <i class="fa-solid fa-pause"></i>
                </button>
            </div>

            <button type="button" class="icon-btn" id="next" onclick="next()" title="Next" aria-label="Next"><i class="fa-solid fa-forward"></i></button>


        </div>
        </div>
    </footer>
    <div id="noteMeasure" aria-hidden="true"></div>
    <script src="./resources/js/registry.js"></script>
    <script src="./resources/js/exercises/notes.js"></script>
    <script src="./resources/js/exercises/chords.js"></script>
    <script src="./resources/js/exercises/one-two-three-four.js"></script>
    <script src="./resources/js/exercises/play-rest.js"></script>
    <script src="./resources/js/exercises/fingers.js"></script>
    <script src="./resources/js/exercises/intervals.js"></script>
    <script src="./resources/js/exercises/modern-sounds.js"></script>
    <script src="./resources/js/exercises/language.js"></script>
    <script src="./resources/js/exercises/note-pairs.js"></script>
    <script src="./resources/js/exercises/chord-progressions.js"></script>
    <script src="./resources/js/exercises/licks.js"></script>
    <script src="./resources/js/exercises/augmented.js"></script>
    <script src="./resources/js/exercises/augmented-2.js"></script>
    <script src="./resources/js/exercises/quartal-advanced-2.js"></script>
    <script src="./resources/js/picker.js"></script>
    <script src="./resources/js/metronome.js"></script>
    <script src="./resources/js/editor.js"></script>
    <script src="./resources/js/main.js"></script>
    <script>
        document.getElementById('volumeCheckbox').addEventListener('change', function () {
            const icon = this.nextElementSibling;
            if (this.checked) {
                icon.classList.remove('fa-volume-xmark');
                icon.classList.add('fa-volume-high');
            } else {
                icon.classList.remove('fa-volume-high');
                icon.classList.add('fa-volume-xmark');
            }
        });
        
    </script>
</body>

</html>
